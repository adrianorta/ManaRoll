<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Mana Roll — Daily MTG Deck Dice</title>
    <meta name="description" content="Track decks and roll mana colors without any backend or network requests." />
    <style>
      :root {
        --bg: #0b1020;
        --bg-2: #111827;
        --panel: rgba(19, 28, 49, 0.82);
        --panel-strong: rgba(22, 35, 62, 0.96);
        --line: rgba(148, 163, 184, 0.28);
        --text: #edf3ff;
        --muted: #b9c7e4;
        --accent: #7dd3fc;
        --accent-2: #a78bfa;
        --accent-3: #3b82f6;
        --danger: #fca5a5;
        --success: #86efac;
        --shadow: rgba(8, 15, 30, 0.7);
        --white: #f8fafc;
        --blue: #60a5fa;
        --blue-deep: #2563eb;
        --black: #0f172a;
        --red: #f87171;
        --red-deep: #dc2626;
        --green: #4ade80;
        --green-deep: #16a34a;
        --gold: #fbbf24;
        --gold-deep: #d97706;
      }
      * { box-sizing: border-box; }
      html {
        background: #0b1020;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Inter, sans-serif;
        background:
          radial-gradient(circle at top, rgba(91, 125, 255, 0.28), transparent 28%),
          radial-gradient(circle at bottom right, rgba(43, 199, 153, 0.18), transparent 20%),
          linear-gradient(180deg, #0f172a 0%, var(--bg) 40%, #09111c 100%);
        color: var(--text);
        min-height: 100vh;
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 20px 52px;
      }
      .panel {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(17, 27, 48, 0.9));
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 18px 40px var(--shadow);
        backdrop-filter: blur(10px);
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 20px 22px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 3.1rem);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #e2e8f0 0%, #bfdbfe 40%, #c4b5fd 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: linear-gradient(180deg, rgba(30, 41, 59, 1), rgba(15, 23, 42, 1));
        color: var(--text);
        border-radius: 12px;
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(96, 165, 250, 0.18);
        border-color: rgba(96, 165, 250, 0.5);
      }
      button.primary {
        background: linear-gradient(135deg, #7dd3fc, #a78bfa 50%, #c084fc);
        color: #06121f;
        font-weight: 800;
        border-color: transparent;
        box-shadow: 0 10px 28px rgba(125, 211, 252, 0.28);
      }
      .stepper {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 8px;
        border-radius: 12px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.25);
      }
      .stepper button {
        width: 33px;
        height: 33px;
        padding: 0;
        border-radius: 10px;
      }
      .stepper .value {
        min-width: 28px;
        text-align: center;
        font-weight: 800;
        color: #f8fbff;
      }
      .layout {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 20px;
      }
      .section {
        padding: 20px;
      }
      .section h2 {
        margin: 0 0 18px;
        font-size: 1.15rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #dfeafc;
      }
      form.deck-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        margin-bottom: 20px;
      }
      input[type="text"] {
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 12px;
        background: rgba(10, 17, 30, 0.82);
        color: var(--text);
        padding: 12px 14px;
        font: inherit;
        box-shadow: inset 0 1px 1px rgba(255,255,255,.04);
      }
      input[type="text"]:focus {
        outline: none;
        border-color: rgba(125, 211, 252, 0.8);
        box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.18);
      }
      .color-picker {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .color-chip {
        min-width: 46px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(255,255,255,0.02);
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #dfeafc;
      }
      .color-chip.active {
        border-color: transparent;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), 0 8px 20px rgba(59,130,246,0.18);
      }
      .color-chip.W.active { background: linear-gradient(135deg, #f8fafc, #dbeafe); color: #0f172a; }
      .color-chip.U.active { background: linear-gradient(135deg, #60a5fa, #3b82f6); color: #eff6ff; }
      .color-chip.B.active { background: linear-gradient(135deg, #1f2937, #111827); color: #f3f4f6; }
      .color-chip.R.active { background: linear-gradient(135deg, #f87171, #dc2626); color: #fff1f2; }
      .color-chip.G.active { background: linear-gradient(135deg, #4ade80, #16a34a); color: #ecfdf5; }
      .color-chip.C.active { background: linear-gradient(135deg, #d1d5db, #9ca3af); color: #111827; }
      .deck-list {
        display: grid;
        gap: 12px;
      }
      .deck-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: linear-gradient(180deg, rgba(17, 24, 39, 0.9), rgba(15, 23, 42, 0.72));
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      }
      .deck-item.excluded {
        opacity: 0.5;
      }
      .deck-main {
        min-width: 0;
      }
      .deck-name {
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #f8fbff;
      }
      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 7px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        height: 25px;
        padding: 0 8px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        color: #fff;
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.05em;
      }
      .badge.W { background: linear-gradient(135deg, #f8fafc, #dbeafe); color: #111827; }
      .badge.U { background: linear-gradient(135deg, #60a5fa, #2563eb); }
      .badge.B { background: linear-gradient(135deg, #475569, #0f172a); }
      .badge.R { background: linear-gradient(135deg, #f87171, #dc2626); }
      .badge.G { background: linear-gradient(135deg, #4ade80, #16a34a); }
      .badge.C { background: linear-gradient(135deg, #e5e7eb, #9ca3af); color: #111827; }
      .deck-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .tiny {
        padding: 7px 10px;
        font-size: 0.84rem;
        border-radius: 9px;
      }
      .danger {
        border-color: rgba(252, 165, 165, 0.4);
        color: var(--danger);
      }
      .results {
        display: grid;
        gap: 12px;
      }
      .result-card {
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(17, 24, 39, 0.9), rgba(15, 23, 42, 0.74));
        padding: 12px 14px;
      }
      .result-header {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        color: #f1f5f9;
      }
      .muted { color: var(--muted); }
      .empty {
        padding: 20px;
        border-radius: 12px;
        border: 1px dashed rgba(148, 163, 184, 0.35);
        color: var(--muted);
        text-align: center;
        background: rgba(15, 23, 42, 0.3);
      }
      @media (max-width: 780px) {
        .layout { grid-template-columns: 1fr; }
        form.deck-form { grid-template-columns: 1fr; }
        header { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="panel">
        <h1>Mana Roll</h1>
        <div class="toolbar">
          <div class="stepper" aria-label="Decks to roll for">
            <button type="button" id="decrease-count" aria-label="Decrease roll count">−</button>
            <span id="roll-count" class="value">4</span>
            <button type="button" id="increase-count" aria-label="Increase roll count">+</button>
          </div>
          <button type="button" id="roll-button" class="primary">Roll today</button>
        </div>
      </header>

      <div class="layout">
        <main class="panel section">
          <h2>Decks</h2>
          <form class="deck-form" id="deck-form">
            <input id="deck-name" type="text" placeholder="Deck name" maxlength="80" />
            <button type="submit">Add deck</button>
          </form>
          <div class="color-picker" id="color-picker" aria-label="Choose deck colors"></div>
          <div id="deck-list" class="deck-list"></div>
        </main>

        <aside class="panel section">
          <h2>Today's results</h2>
          <div id="results" class="results"></div>
        </aside>
      </div>
    </div>

    <script>
      const STORAGE_KEYS = {
        decks: 'mana-roll.decks',
        rolls: 'mana-roll.rolls',
        count: 'mana-roll-target-count',
        excluded: 'mana-roll-excluded-decks',
      };
      const COLORS = ['W', 'U', 'B', 'R', 'G', 'C'];
      const COLOR_ORDER = { C: 0, W: 1, U: 2, B: 3, R: 4, G: 5 };
      const DEFAULT_ROLL_COUNT = 4;
      const MAX_ROLL_COUNT = 40;

      const state = {
        decks: [],
        excluded: [],
        rollCount: DEFAULT_ROLL_COUNT,
        results: [],
      };

      function clampRollCount(value) {
        if (!Number.isFinite(value)) return DEFAULT_ROLL_COUNT;
        return Math.max(1, Math.min(MAX_ROLL_COUNT, Math.floor(value)));
      }

      function normalizeColors(colors) {
        if (!Array.isArray(colors)) return [];
        const unique = [...new Set(colors.filter((color) => COLORS.includes(color)))];
        if (unique.includes('C')) return ['C'];
        return unique.sort((left, right) => (COLOR_ORDER[left] || 0) - (COLOR_ORDER[right] || 0));
      }

      function colorKey(colors) {
        return normalizeColors(colors).join(',');
      }

      function loadJSON(key, fallback) {
        try {
          const raw = window.localStorage.getItem(key);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          return parsed ?? fallback;
        } catch (_error) {
          return fallback;
        }
      }

      function saveJSON(key, value) {
        try {
          window.localStorage.setItem(key, JSON.stringify(value));
        } catch (_error) {
          // Browser storage may be unavailable. Ignore gracefully.
        }
      }

      function getDecks() {
        state.decks = Array.isArray(loadJSON(STORAGE_KEYS.decks, [])) ? loadJSON(STORAGE_KEYS.decks, []) : [];
        return state.decks;
      }

      function saveDecks() {
        saveJSON(STORAGE_KEYS.decks, state.decks);
      }

      function getRolls() {
        return loadJSON(STORAGE_KEYS.rolls, {});
      }

      function saveRolls(rolls) {
        saveJSON(STORAGE_KEYS.rolls, rolls);
      }

      function getExcludedIds() {
        const parsed = loadJSON(STORAGE_KEYS.excluded, []);
        state.excluded = Array.isArray(parsed) ? parsed.filter((value) => Number.isFinite(value)) : [];
        return state.excluded;
      }

      function saveExcludedIds() {
        saveJSON(STORAGE_KEYS.excluded, state.excluded);
      }

      function getTodayKey() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function getRollCount() {
        const value = Number(window.localStorage.getItem(STORAGE_KEYS.count));
        state.rollCount = clampRollCount(Number.isFinite(value) ? value : DEFAULT_ROLL_COUNT);
        return state.rollCount;
      }

      function saveRollCount() {
        window.localStorage.setItem(STORAGE_KEYS.count, String(state.rollCount));
      }

      function getEligibleDecks() {
        return getDecks().filter((deck) => !state.excluded.includes(deck.id));
      }

      function randomDiceRoll() {
        const dice = [];
        for (let index = 0; index < 5; index += 1) {
          dice.push(COLORS[Math.floor(Math.random() * COLORS.length)]);
        }
        return dice;
      }

      function matchedColorsForDice(dice) {
        const filtered = dice.filter((value) => value !== 'C');
        if (filtered.length === 0) return ['C'];
        return normalizeColors(filtered);
      }

      function createDeckRecord(name, colors) {
        return {
          id: Date.now() + Math.random(),
          name: name.trim(),
          colors: normalizeColors(colors).length ? normalizeColors(colors) : ['C'],
        };
      }

      function generateRollResults(eligibleDecks, count) {
        const pool = [...eligibleDecks];
        const used = new Set();
        const results = [];

        while (results.length < count && pool.length > 0) {
          const candidate = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
          if (!candidate) break;
          if (!used.has(candidate.id)) {
            used.add(candidate.id);
            results.push({
              deckId: candidate.id,
              deckName: candidate.name,
              colors: candidate.colors,
              dice: randomDiceRoll(),
            });
          }
        }

        if (results.length >= count) return results.slice(0, count);

        let attempts = 0;
        while (results.length < count && attempts < 2000) {
          attempts += 1;
          const dice = randomDiceRoll();
          const matched = matchedColorsForDice(dice);
          const key = colorKey(matched);
          const deck = eligibleDecks.find((candidate) => !used.has(candidate.id) && colorKey(candidate.colors) === key);
          if (deck) {
            used.add(deck.id);
            results.push({
              deckId: deck.id,
              deckName: deck.name,
              colors: matched,
              dice,
            });
          }
        }

        if (results.length < count) {
          const remaining = eligibleDecks.filter((deck) => !used.has(deck.id));
          remaining.slice(0, count - results.length).forEach((deck) => {
            results.push({
              deckId: deck.id,
              deckName: deck.name,
              colors: deck.colors,
              dice: randomDiceRoll(),
            });
          });
        }

        return results.slice(0, count);
      }

      function renderColorPicker() {
        const picker = document.getElementById('color-picker');
        picker.innerHTML = '';
        const selected = new Set(document.getElementById('deck-name').dataset.colors ? JSON.parse(document.getElementById('deck-name').dataset.colors) : []);

        COLORS.forEach((color) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `color-chip ${color} ${selected.has(color) ? 'active' : ''}`;
          button.textContent = color;
          button.addEventListener('click', () => {
            const current = JSON.parse(document.getElementById('deck-name').dataset.colors || '[]');
            const exists = current.includes(color);
            const next = exists ? current.filter((value) => value !== color) : [...current, color];
            document.getElementById('deck-name').dataset.colors = JSON.stringify(next);
            renderColorPicker();
          });
          picker.appendChild(button);
        });
      }

      function renderDecks() {
        const list = document.getElementById('deck-list');
        const decks = getDecks();
        list.innerHTML = '';

        if (!decks.length) {
          list.innerHTML = '<div class="empty">Add a deck to get started.</div>';
          return;
        }

        decks.forEach((deck) => {
          const item = document.createElement('div');
          item.className = `deck-item ${state.excluded.includes(deck.id) ? 'excluded' : ''}`;

          const main = document.createElement('div');
          main.className = 'deck-main';

          const title = document.createElement('div');
          title.className = 'deck-name';
          title.textContent = deck.name;
          main.appendChild(title);

          const badges = document.createElement('div');
          badges.className = 'badge-row';
          const colors = normalizeColors(deck.colors);
          if (!colors.length) {
            const badge = document.createElement('span');
            badge.className = 'badge C';
            badge.textContent = 'C';
            badges.appendChild(badge);
          } else {
            colors.forEach((color) => {
              const badge = document.createElement('span');
              badge.className = `badge ${color}`;
              badge.textContent = color;
              badges.appendChild(badge);
            });
          }
          main.appendChild(badges);

          const actions = document.createElement('div');
          actions.className = 'deck-actions';

          const toggleExclude = document.createElement('button');
          toggleExclude.type = 'button';
          toggleExclude.className = 'tiny';
          toggleExclude.textContent = state.excluded.includes(deck.id) ? 'Include' : 'Exclude';
          toggleExclude.addEventListener('click', () => {
            if (state.excluded.includes(deck.id)) {
              state.excluded = state.excluded.filter((value) => value !== deck.id);
            } else {
              state.excluded.push(deck.id);
            }
            saveExcludedIds();
            renderDecks();
            renderResults();
          });

          const rename = document.createElement('button');
          rename.type = 'button';
          rename.className = 'tiny';
          rename.textContent = 'Rename';
          rename.addEventListener('click', () => {
            const nextName = window.prompt('New deck name', deck.name);
            if (nextName === null) return;
            const trimmed = nextName.trim();
            if (!trimmed) return;
            deck.name = trimmed;
            saveDecks();
            renderDecks();
          });

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'tiny danger';
          remove.textContent = 'Delete';
          remove.addEventListener('click', () => {
            if (!window.confirm(`Delete ${deck.name}?`)) return;
            state.decks = state.decks.filter((candidate) => candidate.id !== deck.id);
            state.excluded = state.excluded.filter((value) => value !== deck.id);
            saveDecks();
            saveExcludedIds();
            renderDecks();
            renderResults();
          });

          actions.appendChild(toggleExclude);
          actions.appendChild(rename);
          actions.appendChild(remove);
          item.appendChild(main);
          item.appendChild(actions);
          list.appendChild(item);
        });
      }

      function renderResults() {
        const resultsEl = document.getElementById('results');
        const rolls = getRolls();
        const todayKey = getTodayKey();
        const todayResults = Array.isArray(rolls[todayKey]?.results) ? rolls[todayKey].results : [];
        state.results = todayResults;

        if (!todayResults.length) {
          resultsEl.innerHTML = '<div class="empty">No rolls yet. Hit “Roll today” to generate a result.</div>';
          return;
        }

        resultsEl.innerHTML = '';
        todayResults.forEach((result, index) => {
          const card = document.createElement('div');
          card.className = 'result-card';
          const header = document.createElement('div');
          header.className = 'result-header';
          const label = document.createElement('strong');
          label.textContent = `Pick ${index + 1}`;
          const deck = document.createElement('span');
          deck.textContent = result.deckName || 'No match';
          header.appendChild(label);
          header.appendChild(deck);

          const dice = document.createElement('div');
          dice.className = 'muted';
          dice.textContent = result.dice ? `Dice: ${result.dice.join(' ')}` : 'Dice: —';

          const match = document.createElement('div');
          match.className = 'muted';
          match.textContent = `Colors: ${Array.isArray(result.colors) && result.colors.length ? result.colors.join(' ') : '—'}`;

          card.appendChild(header);
          card.appendChild(dice);
          card.appendChild(match);
          resultsEl.appendChild(card);
        });
      }

      function syncRollCount() {
        const count = getRollCount();
        document.getElementById('roll-count').textContent = String(count);
        document.getElementById('decrease-count').disabled = count <= 1;
        document.getElementById('increase-count').disabled = count >= MAX_ROLL_COUNT;
      }

      function rollToday() {
        const eligibleDecks = getEligibleDecks();
        if (!eligibleDecks.length) {
          window.alert('Add a deck or include some decks before rolling.');
          return;
        }
        const count = Math.min(state.rollCount, eligibleDecks.length);
        const results = generateRollResults(eligibleDecks, count);
        const rolls = getRolls();
        const todayKey = getTodayKey();
        rolls[todayKey] = { results };
        saveRolls(rolls);
        renderResults();
      }

      document.getElementById('deck-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const input = document.getElementById('deck-name');
        const raw = input.value.trim();
        const chosenColors = JSON.parse(input.dataset.colors || '[]');
        if (!raw) {
          input.focus();
          return;
        }
        const deck = createDeckRecord(raw, chosenColors);
        state.decks = getDecks();
        state.decks.push(deck);
        saveDecks();
        input.value = '';
        input.dataset.colors = '[]';
        renderColorPicker();
        renderDecks();
      });

      document.getElementById('roll-button').addEventListener('click', rollToday);
      document.getElementById('decrease-count').addEventListener('click', () => {
        state.rollCount = clampRollCount(getRollCount() - 1);
        saveRollCount();
        syncRollCount();
      });
      document.getElementById('increase-count').addEventListener('click', () => {
        state.rollCount = clampRollCount(getRollCount() + 1);
        saveRollCount();
        syncRollCount();
      });

      document.getElementById('deck-name').dataset.colors = '[]';
      renderColorPicker();
      getExcludedIds();
      getRollCount();
      syncRollCount();
      renderDecks();
      renderResults();
    </script>
  </body>
</html>
